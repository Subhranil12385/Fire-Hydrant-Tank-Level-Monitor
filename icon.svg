<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".85">
      <stop offset="0" stop-color="#13307a"/><stop offset=".55" stop-color="#0a1840"/><stop offset="1" stop-color="#050b24"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb8ff"/><stop offset=".45" stop-color="#8a5bff"/><stop offset="1" stop-color="#c24dff"/>
    </linearGradient>
    <clipPath id="tank"><rect x="150" y="118" width="200" height="262" rx="38"/></clipPath>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="b1"/><feGaussianBlur stdDeviation="3" in="SourceGraphic" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <g clip-path="url(#round)"><g stroke="#2a5bd0" stroke-width="1.5" opacity=".28"><path d="M16 0V512M0 16H512"/><path d="M56 0V512M0 56H512"/><path d="M96 0V512M0 96H512"/><path d="M136 0V512M0 136H512"/><path d="M176 0V512M0 176H512"/><path d="M216 0V512M0 216H512"/><path d="M256 0V512M0 256H512"/><path d="M296 0V512M0 296H512"/><path d="M336 0V512M0 336H512"/><path d="M376 0V512M0 376H512"/><path d="M416 0V512M0 416H512"/><path d="M456 0V512M0 456H512"/><path d="M496 0V512M0 496H512"/></g><g>
  <!-- decorative circuit traces (same motif as the sibling icons) -->
  <g fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M58 214h34l14-18"/><circle cx="52" cy="214" r="6" fill="#8b5cf6"/>
    <path d="M456 150h-30l-14 18"/><circle cx="462" cy="150" r="6" fill="#8b5cf6"/>
    <path d="M70 330h26l12 16"/><circle cx="64" cy="330" r="5" fill="#8b5cf6"/>
  </g>
  <g fill="#7fd8ff" opacity=".8">
    <circle cx="118" cy="96" r="3"/><circle cx="408" cy="92" r="2.5"/><circle cx="450" cy="262" r="3"/>
    <circle cx="96" cy="430" r="2.5"/><circle cx="214" cy="452" r="2"/>
  </g>

  <!-- tank interior -->
  <rect x="150" y="118" width="200" height="262" rx="38" fill="#0b1c4d" fill-opacity=".75"/>
  <g clip-path="url(#tank)">
    <path d="M120 262 C158 238 190 238 226 258 S298 284 380 252 V400 H120Z" fill="url(#water)"/>
    <g fill="none" stroke="#e9f6ff" stroke-width="2.5" opacity=".75">
      <circle cx="190" cy="318" r="9"/><circle cx="222" cy="350" r="6"/><circle cx="176" cy="356" r="4.5"/>
    </g>
  </g>
  <!-- water surface line -->
  <path d="M150 262 C176 242 198 242 226 258 S298 282 350 258" fill="none" stroke="#f3e8ff" stroke-width="6"
        stroke-linecap="round" filter="url(#soft)"/>

  <!-- tank outline + lid -->
  <g fill="none" stroke="#19e3ff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <rect x="150" y="118" width="200" height="262" rx="38"/>
    <rect x="214" y="88" width="72" height="20" rx="10"/>
  </g>

  <!-- level ticks -->
  <g stroke="#ffc42e" stroke-width="7" stroke-linecap="round" filter="url(#soft)">
    <path d="M300 160h32M310 196h22M300 232h32"/>
  </g>

  <!-- hydrant badge -->
  <g filter="url(#glowPink)">
    <circle cx="360" cy="360" r="70" fill="#0a1535" stroke="#ff3d6e" stroke-width="9"/>
  </g>
  <g fill="none" stroke="#ffa63d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M338 346a22 20 0 0 1 44 0"/>
    <rect x="355" y="318" width="10" height="8" rx="3"/>
    <rect x="333" y="346" width="54" height="9" rx="4"/>
    <rect x="340" y="355" width="40" height="40" rx="6"/>
    <rect x="330" y="395" width="60" height="11" rx="5"/>
    <rect x="322" y="362" width="18" height="14" rx="4"/>
    <rect x="380" y="362" width="18" height="14" rx="4"/>
  </g>
</g></g>
  <circle cx="256" cy="256" r="249" fill="none" stroke="#1d4bb8" stroke-width="3" opacity=".6"/>
</svg>
